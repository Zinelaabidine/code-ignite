[project]
name = "codeignite-backend"
version = "0.1.0"
description = "Code playground API and worker — sandboxed code execution behind SQS/S3"
requires-python = ">=3.12"
# boto3 arrives with stage 2 (async runs), the first code that imports it.
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  # Only needed for FastAPI's TestClient, which is httpx-based.
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codeignite"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle core. I: import sort. UP: modernize syntax for the
# pinned Python version. B: bugbear (common footguns). SIM: simplifiable code.
# N: naming conventions.
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.isort]
known-first-party = ["codeignite"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom is a call in an argument default
# (`runner: Runner = Depends(get_runner)`) — B008 exists to catch mutable
# default arguments, which this is not. Without this, every route would need
# a per-line `# noqa: B008`.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=codeignite --cov-report=term-missing"
markers = [
  "docker: requires a running Docker daemon (deselect with -m 'not docker')",
]
