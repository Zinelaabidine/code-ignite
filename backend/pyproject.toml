[project]
name = "codeignite-backend"
version = "0.1.0"
description = "Code playground API and worker — sandboxed code execution behind SQS/S3"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "fastapi>=0.115",
  "boto3>=1.34",
  # [crypto] pulls in `cryptography` for RS256 verification of Cognito's
  # JWKS-signed access tokens — see api/auth.py.
  "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
# Split out of the base dependencies because the hosted Lambda deployment
# (api/lambda_handler.py) never runs a server process — Mangum calls the
# ASGI app in-process, so bundling uvicorn/uvloop/httptools into the Lambda
# zip would be dead weight against Lambda's package size limits. Anything
# that runs the API as a long-lived HTTP server (Dockerfile.api, `uvicorn
# codeignite.api.app:app --reload` for local dev) installs this extra.
server = [
  "uvicorn[standard]>=0.34",
]

# The hosted API's entrypoint — see api/lambda_handler.py and
# docs/code-playground-hosted-api-plan.md §3. Not needed for local
# docker compose or CI; only backend/scripts/build-lambda-zip.sh installs it.
lambda = [
  "mangum>=0.19",
]

dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  # Only needed for FastAPI's TestClient, which is httpx-based.
  "httpx>=0.27",
  # boto3 ships no types of its own; boto3-stubs provides real per-service
  # client types (S3Client, SQSClient) instead of everything resolving to
  # Any. Type-check only — not a runtime dependency.
  "boto3-stubs[s3,sqs]>=1.34",
  # Mocks S3/SQS at the botocore layer so storage/worker tests never touch
  # real AWS.
  "moto[s3,sqs]>=5.0",
  # Sets the required CODEIGNITE_* env vars (see [tool.pytest.ini_options])
  # before pytest imports anything — config.py instantiates Settings()
  # eagerly at module load, so those three fields need a value before the
  # first test module (transitively) imports codeignite.config.
  "pytest-env>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codeignite"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle core. I: import sort. UP: modernize syntax for the
# pinned Python version. B: bugbear (common footguns). SIM: simplifiable code.
# N: naming conventions.
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.isort]
known-first-party = ["codeignite"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom is a call in an argument default
# (`runner: Runner = Depends(get_runner)`) — B008 exists to catch mutable
# default arguments, which this is not. Without this, every route would need
# a per-line `# noqa: B008`.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_unreachable = true
# Without this, mypy sees Settings() called with zero arguments and demands
# aws_region/jobs_bucket/runs_queue_url as constructor kwargs — it has no way
# to know pydantic-settings resolves them from the environment at runtime.
# The plugin teaches mypy that BaseSettings subclasses are special-cased this
# way, instead of papering over it with a per-line type: ignore.
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=codeignite --cov-report=term-missing"
markers = [
  "docker: requires a running Docker daemon (deselect with -m 'not docker')",
]
# Placeholder values only — every test that cares about the real content
# overrides via monkeypatch.setenv or moto. These exist purely so
# `codeignite.config.Settings()` (instantiated eagerly at import time) has
# something to validate against; see config.py's docstring for why those
# fields have no default.
env = [
  "CODEIGNITE_AWS_REGION=us-east-1",
  "CODEIGNITE_JOBS_BUCKET=test-jobs-bucket",
  "CODEIGNITE_RUNS_QUEUE_URL=https://sqs.us-east-1.amazonaws.com/123456789012/test-runs-queue",
  "CODEIGNITE_COGNITO_USER_POOL_ID=us-east-1_testpool",
  "CODEIGNITE_COGNITO_CLIENT_ID=test-client-id",
]
