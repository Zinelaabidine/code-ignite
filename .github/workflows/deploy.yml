# ──────────────────────────────────────────────────────────────────────────────
# deploy.yml — Terraform apply + static frontend deploy
#
#   dev branch      → infra/envs/dev      (GitHub environment: dev)
#   staging branch  → infra/envs/staging  (GitHub environment: staging)
#   main branch     → infra/envs/prod     (GitHub environment: prod)
#
# Authentication is GitHub OIDC only — no long-lived AWS keys. The role and its
# trust policy are managed in infra/bootstrap via bootstrap.yml; this workflow
# only attaches application policies and never modifies the trust chain that
# lets it run.
#
# PROTECT THE PROD ENVIRONMENT. A push to main applies to production. The only
# thing that can put a human in front of that is a required reviewer on the
# `prod` GitHub environment (Settings → Environments → prod → Required
# reviewers). Configure it before the first prod deploy.
#
# REQUIRED REPOSITORY VARIABLES (Settings → Secrets and variables → Actions):
#   AWS_ACCOUNT_ID     e.g. 123456789012
#   AWS_REGION         e.g. us-east-1
#   PROJECT_NAME       project slug (e.g. myapp) — also drives site hostnames + state bucket
#   AWS_ACCOUNT_ID     12-digit account ID — state bucket is {PROJECT_NAME}-terraform-state-{AWS_ACCOUNT_ID}
#
# REQUIRED PER-ENVIRONMENT VARIABLES (Settings → Environments → <env>):
#   (none required — DOMAIN_NAME is derived from PROJECT_NAME + HOSTED_ZONE_NAME)
# Optional per-environment overrides:
#   DOMAIN_NAME_OVERRIDE       non-standard FQDN (maps to TF_VAR_domain_name_override)
#   MFA_CONFIGURATION (OFF|OPTIONAL|ON), ADVANCED_SECURITY_MODE
#   (OFF|AUDIT|ENFORCED), ENABLE_WAF (true|false)
#   API_BASE_URL               code-playground API base URL (maps to
#                              NEXT_PUBLIC_API_BASE_URL). Unset resolves to
#                              `null` in frontend/lib/env.ts rather than
#                              failing the build — the playground then shows
#                              a "not available" panel instead of erroring.
#                              Once module.run_api is deployed (see
#                              docs/code-playground-hosted-api-plan.md), set
#                              this to the site's own origin, e.g.
#                              "https://myapp-dev.example.com" — same-origin
#                              on purpose, so no CORS configuration is
#                              needed (see the plan doc §1).
#
# This job also builds backend/scripts/build-lambda-zip.sh's zip and points
# module.run_api's Lambda at it via TF_VAR_lambda_package_path, whenever
# backend/** or infra/** changed — see the "backend" output above. No
# container image, no ECR: the hosted API is a zip-packaged Lambda (Mangum),
# not a Docker image — see docs/code-playground-hosted-api-plan.md §0 and §3.
# The worker is never built or deployed here: it runs on a developer's own
# machine, never in AWS — see docs/code-playground-hosted-api-plan.md §0.
#
# None of these are secret, which is why they are variables rather than
# secrets — but keeping them out of the repo keeps the template forkable and
# your domain out of git history.
# ──────────────────────────────────────────────────────────────────────────────
name: deploy

on:
  push:
    branches:
      - dev
      - staging
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      deploy_frontend:
        description: "Build and deploy the frontend to S3 / CloudFront"
        type: boolean
        default: true
      deploy_infra:
        description: "Run a full Terraform apply (infra HCL changes)"
        type: boolean
        default: false
      allow_destroy:
        description: "Permit the plan to destroy or replace resources (normally blocked)"
        type: boolean
        default: false

# Minimal by default. `id-token: write` is granted only to the job that needs
# it — see the `deploy` job. Granting it at workflow level would hand an OIDC
# token to every job, including the one that runs a third-party action.
permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  # Never cancel a deploy in flight. Cancelling mid-apply strands the Terraform
  # state lock and can leave infrastructure half-changed; queueing is cheap by
  # comparison.
  cancel-in-progress: false

env:
  TF_VERSION: 1.15.8
  NODE_VERSION: 24

jobs:
  changes:
    name: detect changes
    runs-on: self-hosted
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      frontend: ${{ steps.resolve.outputs.frontend }}
      infra: ${{ steps.resolve.outputs.infra }}
      backend: ${{ steps.resolve.outputs.backend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve diff base
        id: base
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          # On the first push to a branch, github.event.before is all zeros and
          # cannot be diffed against. Fall back to the parent commit.
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            before="$(git rev-parse "${{ github.sha }}^" 2>/dev/null || echo "")"
          fi
          echo "sha=$before" >> "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'push' && steps.base.outputs.sha != ''
        id: filter
        with:
          base: ${{ steps.base.outputs.sha }}
          ref: ${{ github.sha }}
          filters: |
            frontend:
              - 'frontend/**'
            infra:
              - 'infra/**'
            backend:
              - 'backend/**'

      - name: Resolve deploy targets
        id: resolve
        run: |
          set -euo pipefail
          to_bool() {
            case "$1" in
              true|True|TRUE) echo "true" ;;
              *) echo "false" ;;
            esac
          }
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            frontend=$(to_bool "${{ inputs.deploy_frontend }}")
            infra=$(to_bool "${{ inputs.deploy_infra }}")
            backend="$infra"
          elif [ -z "${{ steps.base.outputs.sha }}" ]; then
            # No usable diff base (e.g. the very first commit) — deploy both.
            frontend="true"
            infra="true"
            backend="true"
          else
            frontend="${{ steps.filter.outputs.frontend }}"
            infra="${{ steps.filter.outputs.infra }}"
            backend="${{ steps.filter.outputs.backend }}"
          fi
          # An infra-only push still needs the frontend rebuilt: Cognito IDs are
          # baked into the bundle at build time, so a new pool means a new build.
          if [ "$infra" = "true" ]; then
            frontend="true"
          fi
          # A backend-only push still needs a Terraform apply: the only way
          # module.run_api's Lambda picks up a newly built image is
          # `terraform apply` passing the new tag as TF_VAR_backend_image_tag
          # (see infra/modules/run-api/variables.tf's image_tag comment) —
          # there is no separate "just update the running code" deploy path.
          if [ "$backend" = "true" ]; then
            infra="true"
          fi
          {
            echo "frontend=$frontend"
            echo "infra=$infra"
            echo "backend=$backend"
          } >> "$GITHUB_OUTPUT"

  deploy-config-check:
    name: check deployment config
    runs-on: self-hosted
    needs: changes
    if: >
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.infra == 'true'
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check required variables are set
        id: check
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          HOSTED_ZONE_NAME: ${{ vars.HOSTED_ZONE_NAME }}
          CERTIFICATE_DOMAIN_NAME: ${{ vars.CERTIFICATE_DOMAIN_NAME }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$AWS_ACCOUNT_ID" ]          || missing+=("AWS_ACCOUNT_ID")
          [ -n "$PROJECT_NAME" ]            || missing+=("PROJECT_NAME")
          [ -n "$HOSTED_ZONE_NAME" ]        || missing+=("HOSTED_ZONE_NAME")
          [ -n "$CERTIFICATE_DOMAIN_NAME" ] || missing+=("CERTIFICATE_DOMAIN_NAME")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning::Skipping deployment because required GitHub Actions variables are not configured: ${missing[*]}"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  ci:
    name: ci
    needs: changes
    # Same checks that gate a pull request, so a direct push to a deploy branch
    # cannot skip them.
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    name: deploy
    runs-on: self-hosted
    needs: [changes, deploy-config-check, ci]
    if: >-
      ${{ (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.infra == 'true')
      && needs.deploy-config-check.outputs.ready == 'true' }}
    timeout-minutes: 30
    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
    # The only job that talks to AWS, and therefore the only one that gets an
    # OIDC token.
    permissions:
      contents: read
      id-token: write
    env:
      # Terraform reads these directly; no -var-file needed, and nothing
      # identifying is committed to the repo.
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_project_name: ${{ vars.PROJECT_NAME }}
      TF_VAR_domain_name_override: ${{ vars.DOMAIN_NAME_OVERRIDE }}
      TF_VAR_hosted_zone_name: ${{ vars.HOSTED_ZONE_NAME }}
      TF_VAR_certificate_domain_name: ${{ vars.CERTIFICATE_DOMAIN_NAME }}
      TF_VAR_github_owner: ${{ github.repository_owner }}
      TF_VAR_github_repo: ${{ github.event.repository.name }}
      TF_VAR_mfa_configuration: ${{ vars.MFA_CONFIGURATION || 'OFF' }}
      TF_VAR_advanced_security_mode: ${{ vars.ADVANCED_SECURITY_MODE || 'OFF' }}
      TF_VAR_enable_waf: ${{ vars.ENABLE_WAF || 'false' }}
      # Only meaningful together with the "Build Lambda zip" step below,
      # which builds the zip this exact path names before Terraform Apply
      # runs. On a run where that step is skipped
      # (needs.changes.outputs.infra != 'true'), this value is passed but
      # unused — module.run_api's aws_lambda_function isn't in that plan.
      TF_VAR_lambda_package_path: ${{ github.workspace }}/backend/dist/api.zip
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set environment context
        id: set-env
        run: |
          set -euo pipefail
          case "${{ github.ref_name }}" in
            dev)     env_name=dev ;;
            staging) env_name=staging ;;
            main)    env_name=prod ;;
            *) echo "Unsupported branch: ${{ github.ref_name }}" >&2; exit 1 ;;
          esac
          {
            echo "env_name=$env_name"
            echo "tf_dir=infra/envs/$env_name"
          } >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.PROJECT_NAME }}-${{ steps.set-env.outputs.env_name }}-github-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Show AWS identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # common.auto.tfvars symlinks → gitignored infra/common.tfvars. Without
      # this file terraform init fails with "Failed to read variables file".
      - name: Materialize common.tfvars
        run: |
          set -euo pipefail
          cat > infra/common.tfvars <<EOF
          aws_region              = "${{ vars.AWS_REGION || 'us-east-1' }}"
          project_name            = "${{ vars.PROJECT_NAME }}"
          github_owner            = "${{ github.repository_owner }}"
          github_repo             = "${{ github.event.repository.name }}"
          hosted_zone_name        = "${{ vars.HOSTED_ZONE_NAME }}"
          certificate_domain_name = "${{ vars.CERTIFICATE_DOMAIN_NAME }}"
          EOF

      # Bucket name: {PROJECT_NAME}-terraform-state-{AWS_ACCOUNT_ID} — same as Terraform locals.
      - name: Terraform Init
        working-directory: ${{ steps.set-env.outputs.tf_dir }}
        run: |
          set -euo pipefail
          terraform init -input=false -no-color \
            -backend-config="bucket=${{ vars.PROJECT_NAME }}-terraform-state-${{ vars.AWS_ACCOUNT_ID }}"

      # The deploy role's own permissions live in Terraform, so a fresh
      # environment is a chicken-and-egg problem: the role needs the managed
      # policies attached before it can create the resources those policies
      # authorize. Apply the IAM policies first, re-assume the role to pick up
      # the new grants, then apply everything else.
      - name: Terraform Apply deploy IAM policies
        if: needs.changes.outputs.infra == 'true'
        working-directory: ${{ steps.set-env.outputs.tf_dir }}
        run: |
          set -euo pipefail
          # -refresh=false: these targets only render IAM policy JSON from HCL,
          # so a full state refresh buys nothing here.
          terraform apply -refresh=false -auto-approve -input=false -no-color \
            -target=module.static_site.aws_iam_policy.github_deploy_core_policy \
            -target=module.static_site.aws_iam_role_policy_attachment.github_deploy_core \
            -target=module.static_site.time_sleep.iam_propagation \
            -target=module.static_site.aws_iam_policy.github_deploy_storage_policy \
            -target=module.static_site.aws_iam_role_policy_attachment.github_deploy_storage \
            -target=module.static_site.time_sleep.storage_iam_propagation \
            -target=module.static_site.aws_iam_policy.github_deploy_cdn_policy \
            -target=module.static_site.aws_iam_role_policy_attachment.github_deploy_cdn \
            -target=module.static_site.time_sleep.cdn_iam_propagation \
            -target=module.run_pipeline.aws_iam_policy.github_deploy_run_pipeline_policy \
            -target=module.run_pipeline.aws_iam_role_policy_attachment.github_deploy_run_pipeline \
            -target=module.run_pipeline.time_sleep.run_pipeline_iam_propagation \
            -target=module.run_api.aws_iam_policy.github_deploy_run_api_policy \
            -target=module.run_api.aws_iam_role_policy_attachment.github_deploy_run_api \
            -target=module.run_api.time_sleep.run_api_iam_propagation

      - name: Refresh AWS credentials after IAM policy update
        if: needs.changes.outputs.infra == 'true'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.PROJECT_NAME }}-${{ steps.set-env.outputs.env_name }}-github-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Python
        if: needs.changes.outputs.infra == 'true'
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      # Builds backend/dist/api.zip against Lambda's own manylinux2014/
      # Python 3.12 target (see the script), regardless of the runner's own
      # platform. No Docker, no ECR: TF_VAR_lambda_package_path (set above)
      # points module.run_api's aws_lambda_function straight at this zip.
      - name: Build Lambda zip
        if: needs.changes.outputs.infra == 'true'
        working-directory: backend
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          ./scripts/build-lambda-zip.sh
          docker push "$image"

      - name: Terraform Plan
        if: needs.changes.outputs.infra == 'true'
        working-directory: ${{ steps.set-env.outputs.tf_dir }}
        run: terraform plan -out=tfplan -input=false -no-color

      # Treat any unexpected destroy or replacement as a blocker. The site
      # bucket and the Cognito User Pool also carry `prevent_destroy`, but that
      # only fires at apply time, after the plan has already been accepted —
      # and it does not cover every resource. This catches the rest, and makes
      # the intent visible in the log.
      - name: Block destructive plans
        if: needs.changes.outputs.infra == 'true'
        working-directory: ${{ steps.set-env.outputs.tf_dir }}
        run: |
          set -euo pipefail
          terraform show -json tfplan > tfplan.json
          destructive=$(jq -r '
            [ .resource_changes[]?
              | select(.change.actions | index("delete"))
              | .address ] | join("\n")
          ' tfplan.json)

          if [ -n "$destructive" ]; then
            echo "::warning::This plan destroys or replaces resources:"
            echo "$destructive"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.allow_destroy }}" = "true" ]; then
              echo "allow_destroy was set on this manual run — continuing."
            else
              echo "::error::Refusing to apply a destructive plan. Review the resources above."
              echo "If this is intended, re-run via workflow_dispatch with allow_destroy checked." >&2
              exit 1
            fi
          else
            echo "No destroys or replacements in this plan."
          fi

      - name: Terraform Apply
        if: needs.changes.outputs.infra == 'true'
        working-directory: ${{ steps.set-env.outputs.tf_dir }}
        run: terraform apply -auto-approve -input=false -no-color tfplan

      - name: Read Terraform outputs
        if: needs.changes.outputs.frontend == 'true'
        id: tf
        working-directory: ${{ steps.set-env.outputs.tf_dir }}
        run: |
          set -euo pipefail
          {
            echo "s3_bucket_name=$(terraform output -raw s3_bucket_name)"
            echo "cloudfront_distribution_id=$(terraform output -raw cloudfront_distribution_id)"
            echo "site_url=$(terraform output -raw site_url)"
            echo "cognito_user_pool_id=$(terraform output -raw cognito_user_pool_id)"
            echo "cognito_client_id=$(terraform output -raw cognito_client_id)"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: needs.changes.outputs.frontend == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_AWS_REGION: ${{ env.AWS_REGION }}
          NEXT_PUBLIC_USER_POOL_ID: ${{ steps.tf.outputs.cognito_user_pool_id }}
          NEXT_PUBLIC_CLIENT_ID: ${{ steps.tf.outputs.cognito_client_id }}
          # Optional — unset (empty string) resolves to `null` in
          # frontend/lib/env.ts, since there is no hosted API yet.
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.API_BASE_URL }}

      # Upload order matters. Assets go up first so the new HTML never
      # references a chunk that is not there yet; the prune runs last so the
      # old build stays servable until the invalidation has landed.
      - name: Upload hashed assets
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: |
          set -euo pipefail
          # Everything under _next/static carries a content hash in its
          # filename, so it can be cached forever and never revalidated.
          if [ -d ./out/_next/static ]; then
            aws s3 sync ./out/_next/static "s3://${{ steps.tf.outputs.s3_bucket_name }}/_next/static" \
              --no-progress \
              --cache-control "public,max-age=31536000,immutable"
          fi

      - name: Upload HTML and unhashed assets
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: |
          set -euo pipefail
          # HTML and files copied from public/ keep their names between builds,
          # so they must be revalidated on every request. CloudFront still
          # caches them; `must-revalidate` just forces a conditional request.
          aws s3 sync ./out "s3://${{ steps.tf.outputs.s3_bucket_name }}" \
            --no-progress \
            --exclude "_next/static/*" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront
        if: needs.changes.outputs.frontend == 'true'
        run: |
          set -euo pipefail
          # A wildcard counts as a single path against the 1,000 free
          # invalidation paths per month, so "/*" is both the simplest and the
          # cheapest option.
          invalidation_id=$(aws cloudfront create-invalidation \
            --distribution-id "${{ steps.tf.outputs.cloudfront_distribution_id }}" \
            --paths "/*" \
            --query 'Invalidation.Id' --output text)
          echo "Waiting for invalidation $invalidation_id to complete..."
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ steps.tf.outputs.cloudfront_distribution_id }}" \
            --id "$invalidation_id"

      - name: Prune deleted files
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: |
          set -euo pipefail
          # Runs only after the invalidation has completed, so no viewer is
          # still being served HTML that points at the objects removed here.
          aws s3 sync ./out "s3://${{ steps.tf.outputs.s3_bucket_name }}" \
            --no-progress --delete --size-only

      - name: Summarise deployment
        if: needs.changes.outputs.frontend == 'true'
        run: |
          {
            echo "### Deployed to \`${{ steps.set-env.outputs.env_name }}\`"
            echo ""
            echo "- URL: ${{ steps.tf.outputs.site_url }}"
            echo "- Commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
