# Static analysis for the TypeScript in frontend/. Runs on pull requests, on
# pushes to the deploy branches, and weekly — the weekly run matters because
# CodeQL's rules improve over time and code that was clean six months ago is
# not necessarily clean today.
name: codeql

on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]
  schedule:
    # Mondays at 06:17 UTC. Off the hour to avoid the scheduling stampede.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze
    runs-on: self-hosted
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: javascript-typescript
          # security-extended adds lower-severity rules that the default suite
          # leaves out; worth it for an app whose only credential store is the
          # browser.
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: "/language:javascript-typescript"
