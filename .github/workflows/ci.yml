# ──────────────────────────────────────────────────────────────────────────────
# ci.yml — checks that must pass before code can merge or deploy.
#
# Runs on every pull request, and is called by deploy.yml (workflow_call) so the
# same checks gate a deployment. Defining them once keeps the two from drifting.
#
# Nothing here touches AWS: no credentials, no OIDC token, no `id-token: write`.
# `terraform validate` runs with `-backend=false`, so it needs no state access.
#
# Make this workflow a required status check on dev, staging, and main
# (Settings → Branches → branch protection rules). Without that, none of it
# actually blocks anything.
# ──────────────────────────────────────────────────────────────────────────────
name: ci

on:
  pull_request:
    branches: [dev, staging, main]
  workflow_call:

# Deliberately minimal, and inherited by every job below.
permissions:
  contents: read

concurrency:
  # Safe to cancel: these jobs are read-only.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: 1.15.8
  NODE_VERSION: 24
  PYTHON_VERSION: "3.12"

jobs:
  frontend:
    name: frontend
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Check formatting
        working-directory: frontend
        run: npm run format:check

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type-check
        working-directory: frontend
        run: npm run typecheck

      - name: Test
        working-directory: frontend
        run: npm run test

      # Placeholder Cognito IDs: the build only needs the variables to exist,
      # and baking real ones into a PR build would be pointless anyway.
      # NEXT_PUBLIC_API_BASE_URL is deliberately left unset here: it is
      # optional (frontend/lib/env.ts resolves a missing value to `null`
      # rather than failing the build), and there is no hosted API for a PR
      # build to point at yet. Left in this block, commented, so a future
      # required var never gets added to the same file without noticing the
      # pattern this one follows.
      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_AWS_REGION: us-east-1
          NEXT_PUBLIC_USER_POOL_ID: us-east-1_ciplaceholder
          NEXT_PUBLIC_CLIENT_ID: ciplaceholderclientid000000
          # NEXT_PUBLIC_API_BASE_URL: (optional — unset in CI, see above)

  backend:
    name: backend
    runs-on: self-hosted
    timeout-minutes: 15
    # setup-python defaults to /Users/runner on macOS self-hosted runners
    # when AGENT_TOOLSDIRECTORY is unset — mkdir fails for non-runner users.
    env:
      RUNNER_TOOL_CACHE: ${{ github.workspace }}/../../_tool
      AGENT_TOOLSDIRECTORY: ${{ github.workspace }}/../../_tool
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        run: |
          set -euo pipefail
          if command -v python3.12 >/dev/null 2>&1; then py=python3.12
          elif command -v python3 >/dev/null 2>&1; then py=python3
          else echo "::error::python3 not found on the self-hosted runner" >&2; exit 1; fi
          "$py" --version
          echo "PYTHON=$py" >> "$GITHUB_ENV"
          "$py" -m pip install --upgrade pip

      # [lambda] pulls in mangum: api/lambda_handler.py imports it, and
      # `mypy --strict src` type-checks that file below. Without the extra,
      # mypy fails with "Cannot find implementation or library stub for
      # module named 'mangum'" even though nothing here runs the Lambda
      # entrypoint.
      - name: Install dependencies
        working-directory: backend
        run: "$PYTHON" -m pip install -e ".[dev,lambda]"

      - name: Check formatting
        working-directory: backend
        run: ruff format --check .

      - name: Lint
        working-directory: backend
        run: ruff check .

      - name: Type-check
        working-directory: backend
        run: mypy --strict src

      # Docker-dependent tests (LocalDockerRunner, from the next PR onward)
      # are marked `docker` and need a daemon this runner does not yet have
      # wired up — deselect them here, run them where Docker is available.
      - name: Test
        working-directory: backend
        run: pytest -m "not docker"

  terraform:
    name: terraform
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Only regular .tf / .tfvars files. common.auto.tfvars are symlinks to
      # gitignored infra/common.tfvars — terraform fmt -recursive fails in CI
      # when those targets are absent ("Failed to read file …/common.auto.tfvars").
      - name: Format check
        working-directory: infra
        run: find . \( -name '*.tf' -o -name '*.tfvars' \) -type f -exec terraform fmt -check {} +

      # Validation catches what fmt cannot: undeclared variables, bad attribute
      # names, type errors, broken interpolations. Previously this only ran in
      # an opt-in local git hook, so a bad module change reached the deploy
      # branch before anything noticed.
      - name: Validate every root
        run: |
          set -euo pipefail
          # common.auto.tfvars symlinks point at gitignored infra/common.tfvars.
          # Seed from the example so init/validate can resolve those targets in CI.
          cp infra/common.tfvars.example infra/common.tfvars
          for dir in infra/bootstrap infra/envs/dev infra/envs/staging infra/envs/prod; do
            echo "::group::terraform validate $dir"
            terraform -chdir="$dir" init -backend=false -input=false -no-color
            terraform -chdir="$dir" validate -no-color
            echo "::endgroup::"
          done

      # A lock file that is out of date with the configuration means CI and
      # workstations can resolve different provider versions.
      - name: Check provider lock files are committed and current
        run: |
          set -euo pipefail
          missing=0
          for dir in infra/bootstrap infra/envs/dev infra/envs/staging infra/envs/prod; do
            if [ ! -f "$dir/.terraform.lock.hcl" ]; then
              echo "::error file=$dir::.terraform.lock.hcl is missing. Run: terraform -chdir=$dir providers lock -platform=linux_amd64 -platform=darwin_arm64"
              missing=1
            fi
          done
          exit "$missing"

  security:
    name: security scan
    # Temporarily disabled — Trivy AWS-0067 on run-api's CloudFront Lambda
    # permission (source_account without source_arn; see lambda.tf comment)
    # was blocking deploy. Re-enable once that finding is suppressed or fixed.
    if: ${{ false }}
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Misconfiguration scanning for the Terraform: public buckets, missing
      # encryption, permissive IAM, unencrypted transport.
      - name: Scan IaC for misconfiguration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          exit-code: "1"
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore

      # Second line of defence behind GitHub's own push protection.
      - name: Scan for committed secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: "1"
          severity: MEDIUM,HIGH,CRITICAL

      # Blocking on purpose. If a transitive high-severity advisory has no fix
      # available and is not reachable from this app, triage it explicitly —
      # `npm audit --json` to confirm the path, then pin an override in
      # package.json rather than lowering this threshold for everything.
      - name: Audit npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
